services:
  mongo:
    image: mongo:8
    container_name: prolific-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: prolific
      MONGO_INITDB_ROOT_PASSWORD: prolific_dev_password
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
